<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catálogo de los mejores juegos de puzle - Explora, filtra y descubre">
  <meta name="theme-color" content="#00f3ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PuzzleGames">
  <title>Best Puzzle Games - Catálogo de Juegos de Puzle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬢</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬢</text></svg>">
</head>
<body>
  <!-- Background glow effects -->
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>
  <div class="bg-glow glow-3"></div>

  <!-- Particle canvas -->
  <canvas id="particles-canvas"></canvas>

  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <span class="logo-icon">⬢</span>
          <h1 class="logo-text">Best Puzzle Games</h1>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="search-wrapper">
        <div class="search-input-container">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="text"
            id="search-input"
            class="search-input"
            placeholder="Buscar juegos por título..."
            autocomplete="off"
          >
          <span class="search-hint">⌘K</span>
        </div>
        <div id="search-results-count" class="search-results-count" aria-live="polite"></div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main">
      <!-- Tags Sidebar -->
      <aside class="tags-sidebar" id="tags-sidebar" role="complementary" aria-label="Filtros por etiquetas">
        <div class="sidebar-header">
          <h2 class="sidebar-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
              <line x1="7" y1="7" x2="7.01" y2="7"></line>
            </svg>
            Etiquetas
          </h2>
          <span id="total-games-count" class="total-count">50 juegos</span>
        </div>
        <div class="tags-list" id="tags-list" role="listbox" aria-label="Lista de etiquetas">
          <!-- Tags will be dynamically inserted here -->
        </div>
        <button id="clear-filters" class="clear-filters-btn" aria-label="Limpiar todos los filtros">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
          Limpiar filtros
        </button>
      </aside>

      <!-- Games Grid -->
      <section class="games-section" aria-label="Catálogo de juegos">
        <div class="section-header">
          <h2 class="section-title">Catálogo de Juegos</h2>
          <div class="section-controls" role="group" aria-label="Controles de vista y ordenación">
            <select id="sort-select" class="sort-select" aria-label="Ordenar juegos">
              <option value="default">🎮 Por defecto</option>
              <option value="top-rated">⭐ Mejor valorados</option>
              <option value="most-liked">❤️ Más votados</option>
              <option value="favorites">💖 Mis favoritos</option>
            </select>
            <div class="view-toggle" role="group" aria-label="Cambiar vista">
              <button class="view-btn active" data-view="grid" aria-label="Vista cuadrícula" aria-pressed="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                  <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                  <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                  <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                </svg>
              </button>
              <button class="view-btn" data-view="list" aria-label="Vista lista" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="4" y1="6" x2="20" y2="6"></line>
                  <line x1="4" y1="12" x2="20" y2="12"></line>
                  <line x1="4" y1="18" x2="20" y2="18"></line>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <div class="games-grid" id="games-grid" role="list">
          <!-- Game cards will be dynamically inserted here -->
        </div>

        <div id="no-results" class="no-results hidden" role="status" aria-live="polite">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
          </svg>
          <h3>No se encontraron juegos</h3>
          <p>Intenta con otros términos de búsqueda o limpia los filtros</p>
          <button id="reset-search" class="reset-btn">Limpiar búsqueda</button>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-content">
        <div class="footer-info">
          <span class="logo-mini">⬢</span>
          <span>Best Puzzle Games</span>
        </div>
        <div class="footer-links">
          <a href="https://github.com/tu-usuario/best-puzzle-games" target="_blank" rel="noopener noreferrer" class="footer-link">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
            </svg>
            GitHub
          </a>
          <span class="footer-divider">•</span>
          <span class="footer-text">Hecho por HorusvsSet</span>
        </div>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
